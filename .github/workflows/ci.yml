name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5.4.1
        with:
          python-version: "3.11"
      - run: uv pip install ruff
      - run: uv run --no-project ruff check . meme
      - run: uv run --no-project ruff format --check . meme

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5.4.1
        with:
          python-version: "3.11"
      - run: uv pip install mcp
      - run: uv run --no-project python3 tests/test_server.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5.4.1
        with:
          python-version: "3.11"
      - run: uv pip install bandit pip-audit mcp
      - run: uv run --no-project bandit meme_server.py meme -s B101,B310,B404,B603,B607,B311
      - run: uv run --no-project pip-audit
